name: Deploy

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: build ui
        working-directory: dnd-web
        run: |
          npm ci
          npm test -- --watchAll=false
          npm run build
